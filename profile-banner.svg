<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="pdvrBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="55%" stop-color="#0A1328" />
      <stop offset="100%" stop-color="#0D1F44" />
    </linearGradient>

    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>

    <linearGradient id="scanSweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>

    <clipPath id="frameClip">
      <rect x="0" y="0" width="1200" height="360" rx="22" />
    </clipPath>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="360" rx="22" fill="url(#pdvrBg)" />

  <!-- Subtle Perspective Cyber Grid -->
  <g stroke="#38BDF8" stroke-width="1" opacity="0.06">
    <line x1="120" y1="0" x2="120" y2="360" />
    <line x1="240" y1="0" x2="240" y2="360" />
    <line x1="360" y1="0" x2="360" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="720" y1="0" x2="720" y2="360" />
    <line x1="840" y1="0" x2="840" y2="360" />
    <line x1="960" y1="0" x2="960" y2="360" />
    <line x1="1080" y1="0" x2="1080" y2="360" />
    <line x1="0" y1="72" x2="1200" y2="72" />
    <line x1="0" y1="144" x2="1200" y2="144" />
    <line x1="0" y1="216" x2="1200" y2="216" />
    <line x1="0" y1="288" x2="1200" y2="288" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="960" cy="90" r="140" fill="#2563EB" opacity="0.14" />
  <circle cx="200" cy="280" r="110" fill="#0EA5E9" opacity="0.10" />

  <!-- Animated Light Sweep -->
  <g clip-path="url(#frameClip)">
    <rect x="-260" y="0" width="240" height="360" fill="url(#scanSweep)">
      <animate attributeName="x" values="-260;1320" dur="7.5s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Live Status Indicator -->
  <g transform="translate(88, 44)">
    <circle cx="0" cy="0" r="5" fill="#38BDF8">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite" />
      <animate attributeName="r" values="5;6.5;5" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <text x="16" y="4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing="2" fill="#7DD3FC">
      VIJAYAWADA · ANDHRA PRADESH · INDIA
    </text>
    <text x="1024" y="4" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing="1.5" fill="#94A3B8">
      PDVRGAMING.GITHUB.IO
    </text>
  </g>

  <!-- Stylized Animated VR Headset Vector Emblem -->
  <g transform="translate(88, 95)">
    <rect width="124" height="124" rx="28" fill="#0B162C" stroke="url(#accentBlue)" stroke-width="2.5" />
    <!-- VR Visor silhouette -->
    <rect x="22" y="40" width="80" height="44" rx="14" fill="#1E3A8A" stroke="#60A5FA" stroke-width="2" />
    <rect x="30" y="48" width="64" height="28" rx="9" fill="#071124" />
    <!-- Animated Visor Glow Wave -->
    <path d="M 38 62 Q 50 50, 62 62 T 86 62" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.4s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Primary Brand Typography -->
  <g transform="translate(244, 136)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text font-size="54" font-weight="900" letter-spacing="3" fill="#FFFFFF">
      PDVR <tspan fill="#38BDF8">GAMING</tspan>
    </text>
    <text y="38" font-size="19" font-weight="500" fill="#CBD5E1">
      Virtual Reality Experiences, Motion Simulators &amp; Offline-First Web Apps
    </text>
    <text y="68" font-size="14" font-weight="600" letter-spacing="0.5" fill="#7DD3FC">
      360° VR Rides · School STEM Expeditions · Event Arenas · Privacy-First PWAs
    </text>
  </g>

  <!-- Capability Capsules -->
  <g transform="translate(88, 272)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">
    <g transform="translate(0, 0)">
      <rect width="205" height="42" rx="11" fill="#0F1D3A" stroke="#2563EB" stroke-width="1.5" />
      <text x="102" y="26" text-anchor="middle">🥽 Commercial VR Arenas</text>
    </g>
    <g transform="translate(222, 0)">
      <rect width="215" height="42" rx="11" fill="#0F1D3A" stroke="#2563EB" stroke-width="1.5" />
      <text x="107" y="26" text-anchor="middle">🎓 School STEM Workshops</text>
    </g>
    <g transform="translate(454, 0)">
      <rect width="215" height="42" rx="11" fill="#0F1D3A" stroke="#2563EB" stroke-width="1.5" />
      <text x="107" y="26" text-anchor="middle">🏥 MEDIC Offline Health PWA</text>
    </g>
    <g transform="translate(686, 0)">
      <rect width="225" height="42" rx="11" fill="#0F1D3A" stroke="#2563EB" stroke-width="1.5" />
      <text x="112" y="26" text-anchor="middle">📍 Vijayawada · +91 9133020759</text>
    </g>
  </g>

  <!-- Border Frame -->
  <rect x="1" y="1" width="1198" height="358" rx="22" fill="none" stroke="#38BDF8" stroke-opacity="0.28" stroke-width="1.5" />
</svg>
